<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mes Prêts — Suivi LCL</title>
<meta name="description" content="Suivi de prêts — capital restant dû, intérêts payés et échéancier interactif." />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#070a14;--card:rgba(255,255,255,.045);--card-strong:rgba(255,255,255,.07);
    --border:rgba(255,255,255,.09);--border-strong:rgba(255,255,255,.16);
    --txt:#eef2ff;--muted:#8b93b0;--violet:#7c5cff;--cyan:#22d3ee;--emerald:#34d399;
    --amber:#fbbf24;--rose:#fb7185;--radius:22px;--shadow:0 24px 60px -20px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Inter','Noto Sans Georgian',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--txt);line-height:1.5;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
  body::before,body::after{content:"";position:fixed;z-index:0;border-radius:50%;filter:blur(120px);opacity:.35;pointer-events:none;}
  body::before{width:560px;height:560px;background:radial-gradient(circle,#7c5cff,transparent 70%);top:-180px;left:-120px;}
  body::after{width:520px;height:520px;background:radial-gradient(circle,#22d3ee,transparent 70%);bottom:-200px;right:-140px;opacity:.25;}
  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:28px 20px 64px;}

  header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:24px;}
  .brand h1{font-family:'Space Grotesk','Noto Sans Georgian',sans-serif;font-size:clamp(26px,5vw,40px);font-weight:700;letter-spacing:-.02em;
    background:linear-gradient(120deg,#fff 10%,#b9c2ff 55%,#7ee9ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand p{color:var(--muted);font-size:14px;margin-top:4px;}
  .head-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  .badge{font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--muted);white-space:nowrap;}
  .badge b{color:var(--txt);font-weight:600;}

  .toggle{display:inline-flex;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:12px;padding:4px;gap:3px;}
  .toggle button{appearance:none;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;padding:7px 13px;border-radius:9px;cursor:pointer;transition:.2s;white-space:nowrap;}
  .toggle button:hover{color:var(--txt);}
  .lang-toggle button.active{color:#fff;background:linear-gradient(120deg,var(--violet),#5b8cff);}

  .segmented{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:5px;gap:4px;margin-bottom:22px;flex-wrap:wrap;}
  .segmented button{appearance:none;border:0;background:transparent;color:var(--muted);font-family:inherit;font-size:14px;font-weight:600;padding:9px 18px;border-radius:10px;cursor:pointer;transition:.22s;white-space:nowrap;}
  .segmented button:hover{color:var(--txt);}
  .segmented button.active{color:#fff;background:linear-gradient(120deg,var(--violet),#5b8cff);box-shadow:0 8px 22px -8px rgba(124,92,255,.8);}

  .cursor-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:22px;backdrop-filter:blur(14px);box-shadow:var(--shadow);}
  .cursor-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .cursor-head .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);}
  .cursor-date{font-family:'Space Grotesk','Noto Sans Georgian',sans-serif;font-size:clamp(20px,4vw,28px);font-weight:600;}
  .cursor-state{font-size:12.5px;margin-top:7px;display:flex;align-items:center;gap:7px;color:var(--emerald);}
  .cursor-state.off{color:var(--amber);}
  .cursor-state .sdot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor;}
  .cursor-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .pill-btn{appearance:none;border:1px solid var(--border-strong);background:var(--card-strong);color:var(--txt);font-family:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;transition:.2s;}
  .pill-btn:hover{border-color:var(--cyan);color:var(--cyan);}
  .pill-btn.solid{background:linear-gradient(120deg,var(--violet),#5b8cff);border:0;color:#fff;}
  .pill-btn.solid.attn{animation:pulse 1.7s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(124,92,255,.55)}50%{box-shadow:0 0 0 8px rgba(124,92,255,0)}}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:999px;outline:none;cursor:pointer;
    background:var(--track,linear-gradient(90deg,var(--violet) 0%,var(--cyan) 30%,rgba(255,255,255,.12) 30%));}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--violet);box-shadow:0 4px 16px rgba(124,92,255,.7);cursor:grab;transition:transform .12s;}
  input[type=range]::-webkit-slider-thumb:active{transform:scale(1.18);cursor:grabbing;}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--violet);box-shadow:0 4px 16px rgba(124,92,255,.7);cursor:grab;}
  .range-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:10px;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
  .kpi{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px 16px;overflow:hidden;backdrop-filter:blur(14px);transition:.25s;}
  .kpi:hover{transform:translateY(-3px);border-color:var(--border-strong);}
  .kpi .k-lbl{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:7px;}
  .kpi .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .kpi .k-val{font-family:'Space Grotesk','Noto Sans Georgian',sans-serif;font-size:clamp(22px,3.4vw,30px);font-weight:700;margin-top:10px;letter-spacing:-.01em;}
  .kpi .k-sub{font-size:12.5px;color:var(--muted);margin-top:6px;min-height:1em;}
  .kpi .k-sub b{color:var(--txt);}
  .kpi.hero{grid-column:1/-1;background:linear-gradient(135deg,rgba(124,92,255,.20),rgba(34,211,238,.10));border-color:rgba(124,92,255,.35);}
  .kpi.hero .k-val{font-size:clamp(34px,8vw,56px);}
  .glow{position:absolute;width:120px;height:120px;border-radius:50%;filter:blur(50px);right:-30px;top:-30px;opacity:.5;}
  .progress{height:9px;border-radius:999px;background:rgba(255,255,255,.08);margin-top:14px;overflow:hidden;}
  .progress > span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--emerald),var(--cyan));transition:width .6s cubic-bezier(.2,.7,.2,1);}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;backdrop-filter:blur(14px);box-shadow:var(--shadow);margin-bottom:22px;}
  .panel-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .panel-head h2{font-family:'Space Grotesk','Noto Sans Georgian',sans-serif;font-size:18px;font-weight:600;}
  .metric-toggle button.active[data-metric=capital]{background:rgba(124,92,255,.85);color:#fff;}
  .metric-toggle button.active[data-metric=interets]{background:rgba(251,191,36,.9);color:#1a1400;}
  .chart-box{position:relative;width:100%;}
  svg.chart{width:100%;height:auto;display:block;overflow:visible;touch-action:none;}
  .tip{position:absolute;transform:translate(-50%,-115%);background:rgba(10,14,28,.95);border:1px solid var(--border-strong);border-radius:12px;padding:9px 12px;font-size:12.5px;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);opacity:0;transition:opacity .15s;}
  .tip .t-d{color:var(--muted);font-size:11px;margin-bottom:2px;}
  .tip .t-v{font-family:'Space Grotesk','Noto Sans Georgian',sans-serif;font-weight:700;font-size:15px;}

  .stack{height:34px;border-radius:12px;overflow:hidden;display:flex;border:1px solid var(--border);}
  .stack > div{height:100%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:#0b0f1a;transition:flex .5s;}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;}
  .legend .item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
  .legend .sw{width:12px;height:12px;border-radius:4px;}
  .legend b{color:var(--txt);}

  .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .chip{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:14px;padding:13px 15px;}
  .chip .c-l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  .chip .c-v{font-family:'Space Grotesk','Noto Sans Georgian',sans-serif;font-size:17px;font-weight:600;margin-top:5px;}

  .early-amt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap;}
  .early-results{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:18px;}
  .early-res{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:14px;padding:13px 15px;}
  .early-res.good{background:linear-gradient(135deg,rgba(52,211,153,.16),rgba(34,211,238,.06));border-color:rgba(52,211,153,.4);}
  .early-res .c-l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .early-res .c-v{font-family:'Space Grotesk','Noto Sans Georgian',sans-serif;font-size:20px;font-weight:700;margin-top:6px;}
  .early-res.good .c-v{color:var(--emerald);}
  .early-note{font-size:12.5px;color:var(--muted);margin-top:16px;line-height:1.65;border-top:1px solid var(--border);padding-top:14px;}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:34px;line-height:1.7;}
  footer b{color:var(--txt);}
  @media (max-width:640px){.wrap{padding:20px 14px 50px;}.kpi{padding:15px;}.head-right{align-items:flex-start;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 id="title">Mes Prêts</h1>
      <p id="subtitle">—</p>
    </div>
    <div class="head-right">
      <div class="toggle lang-toggle" id="langToggle">
        <button data-lang="fr" class="active">FR</button>
        <button data-lang="ka">ქართული</button>
      </div>
      <div class="badges" id="badges"></div>
    </div>
  </header>

  <div class="segmented" id="seg"></div>

  <div class="cursor-card">
    <div class="cursor-head">
      <div>
        <div class="lbl" id="cursorLbl">—</div>
        <div class="cursor-date" id="cursorDate">—</div>
        <div class="cursor-state" id="cursorState"></div>
      </div>
      <div class="cursor-actions">
        <button class="pill-btn solid" id="todayBtn">—</button>
        <button class="pill-btn" id="endBtn">—</button>
      </div>
    </div>
    <input type="range" id="slider" min="0" max="100" value="0" />
    <div class="range-ends"><span id="rangeStart">—</span><span id="rangeEnd">—</span></div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="panel">
    <div class="panel-head">
      <h2 id="chartTitle">—</h2>
      <div class="toggle metric-toggle" id="metricToggle">
        <button data-metric="capital" class="active">—</button>
        <button data-metric="interets">—</button>
      </div>
    </div>
    <div class="chart-box">
      <svg class="chart" id="chart" viewBox="0 0 820 340" preserveAspectRatio="none" role="img" aria-label="graph"></svg>
      <div class="tip" id="tip"></div>
    </div>
  </div>

  <div class="panel" id="earlyPanel">
    <div class="panel-head">
      <h2 id="earlyTitle">—</h2>
      <div class="toggle" id="earlyType">
        <button data-type="etudiant" class="active">—</button>
        <button data-type="conso">—</button>
      </div>
    </div>
    <div class="toggle" id="earlyLoan" style="margin-bottom:16px"></div>
    <div>
      <label class="lbl" id="earlyAmtLbl" style="font-size:12px;color:var(--muted)">—</label>
      <input type="range" id="earlyAmt" min="0" max="100" value="0" style="margin-top:10px" />
      <div class="early-amt-row">
        <span id="earlyAmtVal" class="cursor-date" style="font-size:24px">—</span>
        <button class="pill-btn" id="earlyFull">—</button>
      </div>
    </div>
    <div class="early-results" id="earlyResults"></div>
    <div class="early-note" id="earlyNote"></div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2 id="repartTitle">—</h2></div>
    <div class="stack" id="stack"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="panel">
    <div class="panel-head"><h2 id="infoTitle">—</h2></div>
    <div class="info-grid" id="infoGrid"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script src="data.js"></script>

    else if(k.slice(0,2)==='on')e[k.toLowerCase()]=v;else if(v!=null)e.setAttribute(k,v);}
  for(const kid of kids){if(kid==null||kid===false)continue;e.append(kid.nodeType?kid:document.createTextNode(String(kid)));}
  return e;}
const NS='http://www.w3.org/2000/svg';

  for(const k in (attrs||{}))if(attrs[k]!=null)e.setAttribute(k,attrs[k]);
  for(const kid of kids){if(kid==null)continue;e.append(kid.nodeType?kid:document.createTextNode(String(kid)));}

function stateAt(loan,target){
  const m=loan.meta, startISO=debutISO(m.debut);
  if(target<startISO) return {active:false,capitalRestant:0,cumI:0,cumC:0,cumA:0,mensualite:0,prochaine:null};
  const paid=loan.rows.filter(r=>r.date<=target);
  if(paid.length===0) return {active:true,capitalRestant:m.montant_initial,cumI:0,cumC:0,cumA:0,mensualite:loan.rows[0].montant,prochaine:loan.rows[0]};
  const last=paid[paid.length-1], next=loan.rows.find(r=>r.date>target)||null;
  return {active:true,capitalRestant:last.capital_restant,cumI:last.cumInterets,cumC:last.cumCapital,cumA:last.cumAssurance,
          mensualite:next?next.montant:0,prochaine:next};
}
function viewState(view,target){
  const ls=view==='total'?LOANS:[LOANS[view]];
  const a={capitalRestant:0,cumI:0,cumC:0,cumA:0,mensualite:0,montantInitial:0,totalInterets:0,totalAssurance:0,coutTotal:0,activeCount:0,prochaine:null};
  for(const l of ls){
    const st=stateAt(l,target);
    a.capitalRestant+=st.capitalRestant; a.cumI+=st.cumI; a.cumC+=st.cumC; a.cumA+=st.cumA; a.mensualite+=st.mensualite;
    a.montantInitial+=l.meta.montant_initial; a.totalInterets+=l.rows[l.rows.length-1].cumInterets;
    a.totalAssurance+=l.meta.dont_assurance; a.coutTotal+=l.meta.cout_total;
    if(st.active) a.activeCount++;
    if(st.prochaine && (!a.prochaine || st.prochaine.date<a.prochaine)) a.prochaine=st.prochaine.date;
  }
  a.interetsRestants=Math.max(0,a.totalInterets-a.cumI);
  return a;
}
const series=(view,metric)=>TIMELINE.map(d=>{const st=viewState(view,d);return {date:d,value:metric==='capital'?st.capitalRestant:st.cumI};});

/* ---------- early repayment simulation ---------- */
function computeEarly(loan,dateISO,amount,type){
  const C=stateAt(loan,dateISO).capitalRestant;
  if(C<=0) return null;                                  // déjà soldé à cette date
  amount=Math.min(Math.max(0,amount),C);
  const newC=C-amount;
  const future=loan.rows.filter(x=>x.date>dateISO);      // échéances restantes du tableau réel
  const oldRemInterest=future.reduce((a,x)=>a+x.interets,0);
  const oldRemMonths=future.length;

  // Méthode "tableau réel" : on repère le point où le capital restant d'origine
  // vaut newC ; à mensualité/taux constants, la suite réplique le tableau à partir
  // de là. Les intérêts économisés = intérêts des échéances "sautées" (interpolées).
  let interestSaved=0, monthsSaved=0;
  if(amount>0 && future.length){
    let prevCr=C, j=future.length-1, frac=1;
    for(let i=0;i<future.length;i++){
      if(future[i].capital_restant<=newC){
        j=i; const denom=prevCr-future[i].capital_restant;
        frac = denom>0 ? (prevCr-newC)/denom : 0; break;
      }
      prevCr=future[i].capital_restant;
    }
    for(let i=0;i<j;i++) interestSaved+=future[i].interets; // échéances entièrement sautées
    interestSaved += frac*future[j].interets;               // fraction de l'échéance limite
    monthsSaved = j + frac;
  }
  interestSaved=Math.max(0,Math.min(interestSaved,oldRemInterest));
  const newRemMonths=Math.max(0,oldRemMonths-monthsSaved);

  let ira=0;                                             // indemnité de remboursement anticipé
  if(type==='conso' && amount>10000){
    ira=Math.min(amount*(oldRemMonths>12?0.01:0.005), interestSaved);
  }
  let newEnd=null;
  if(newC>0){const di=new Date(dateISO); di.setMonth(di.getMonth()+Math.round(newRemMonths));
    newEnd=`${di.getFullYear()}-${String(di.getMonth()+1).padStart(2,'0')}-${String(di.getDate()).padStart(2,'0')}`;}
  return {amount,newC,interestSaved,monthsSaved:Math.round(monthsSaved),ira,payNow:amount+ira,newEnd};
}

/* ---------- chart ---------- */
const W=820,H=340,PAD={l:58,r:14,t:18,b:30};
let SERIES=[],SX,SY;
function niceCeil(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;
  const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return m*p;}
function renderChart(){
  const L=tr();
  METRIC=document.querySelector('#metricToggle button.active').dataset.metric;
  SERIES=series(VIEW,METRIC);
  const accent=METRIC==='capital'?'#7c5cff':'#fbbf24', accent2=METRIC==='capital'?'#22d3ee':'#fb923c';
  document.getElementById('chartTitle').textContent=METRIC==='capital'?L.chartCapital:L.chartInterets;
  const niceMax=niceCeil(Math.max(1,...SERIES.map(p=>p.value)));
  SX=i=>PAD.l+i/(SERIES.length-1)*(W-PAD.l-PAD.r);
  SY=v=>H-PAD.b-(v/niceMax)*(H-PAD.t-PAD.b);
  let d=`M ${SX(0)} ${SY(SERIES[0].value)}`;
  for(let i=1;i<SERIES.length;i++) d+=` L ${SX(i)} ${SY(SERIES[i-1].value)} L ${SX(i)} ${SY(SERIES[i].value)}`;
  const area=`${d} L ${SX(SERIES.length-1)} ${SY(0)} L ${SX(0)} ${SY(0)} Z`;
  const defs=s('defs',null,
    s('linearGradient',{id:'area',x1:0,y1:0,x2:0,y2:1},
      s('stop',{offset:'0%','stop-color':accent,'stop-opacity':0.45}),
      s('stop',{offset:'100%','stop-color':accent,'stop-opacity':0})),
    s('linearGradient',{id:'line',x1:0,y1:0,x2:1,y2:0},
      s('stop',{offset:'0%','stop-color':accent}),s('stop',{offset:'100%','stop-color':accent2})));
  const g=[];
  for(let i=0;i<=4;i++){const v=niceMax*i/4,yy=SY(v);
    g.push(s('line',{x1:PAD.l,y1:yy,x2:W-PAD.r,y2:yy,stroke:'rgba(255,255,255,.07)'}));
    g.push(s('text',{x:PAD.l-10,y:yy+4,'text-anchor':'end',fill:'#8b93b0','font-size':11},eur0(v)));}
  let lastYr='';
  SERIES.forEach((p,i)=>{const yr=p.date.slice(0,4);
    if(yr!==lastYr){lastYr=yr; g.push(s('text',{x:SX(i),y:H-8,'text-anchor':'middle',fill:'#8b93b0','font-size':11},yr));}});
  const curLine=s('line',{id:'curLine',stroke:'#fff','stroke-width':1.4,'stroke-dasharray':'4 4',opacity:0.6,x1:0,x2:0,y1:PAD.t,y2:H-PAD.b});
  const curDot=s('circle',{id:'curDot',r:6.5,fill:'#fff',stroke:accent,'stroke-width':3,cx:0,cy:0});
  const svgEl=document.getElementById('chart');
  svgEl.replaceChildren(defs,...g,
    s('path',{d:area,fill:'url(#area)'}),
    s('path',{d:d,fill:'none',stroke:'url(#line)','stroke-width':2.6,'stroke-linejoin':'round'}),curLine,curDot);
  const scrub=(ev)=>{const r=svgEl.getBoundingClientRect();
    const cx=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width*W;
    let i=Math.round((cx-PAD.l)/(W-PAD.l-PAD.r)*(SERIES.length-1));
    setIdx(Math.max(0,Math.min(SERIES.length-1,i)));};
  svgEl.onmousemove=scrub; svgEl.ontouchmove=scrub;
  moveCursor();
}
function moveCursor(){
  if(!SX) return;
  const svgEl=document.getElementById('chart');
  const xi=SX(IDX), yi=SY(SERIES[IDX].value);
  const line=svgEl.querySelector('#curLine'), dot=svgEl.querySelector('#curDot');
  if(line){line.setAttribute('x1',xi);line.setAttribute('x2',xi);}
  if(dot){dot.setAttribute('cx',xi);dot.setAttribute('cy',yi);}
  const tip=document.getElementById('tip'), r=svgEl.getBoundingClientRect();
  tip.style.left=(xi/W*r.width)+'px'; tip.style.top=(yi/H*r.height)+'px'; tip.style.opacity=1;
  tip.replaceChildren(h('div',{class:'t-d'},toDate(SERIES[IDX].date)),h('div',{class:'t-v'},eur(SERIES[IDX].value)));
}

  document.querySelector('#earlyType button[data-type=etudiant]').textContent=L.earlyTypeEtudiant;
  document.querySelector('#earlyType button[data-type=conso]').textContent=L.earlyTypeConso;
  document.getElementById('earlyFull').textContent=L.earlyFull;
  buildEarlyLoan();
  buildSeg(); buildKpis(); renderChart(); render();
}

/* ---------- init ---------- */
function init(){
  document.querySelectorAll('#langToggle button').forEach(btn=>btn.onclick=()=>{
    LANG=btn.dataset.lang;
    document.querySelectorAll('#langToggle button').forEach(x=>x.classList.toggle('active',x===btn));
    refreshTexts();});
  document.querySelectorAll('#metricToggle button').forEach(btn=>btn.onclick=()=>{
    document.querySelectorAll('#metricToggle button').forEach(x=>x.classList.toggle('active',x===btn));
    renderChart();});
  document.querySelectorAll('#earlyType button').forEach(btn=>btn.onclick=()=>{
    earlyType=btn.dataset.type; earlyDirty=false;
    document.querySelectorAll('#earlyType button').forEach(x=>x.classList.toggle('active',x===btn));
    renderEarly();});
  document.getElementById('earlyAmt').oninput=(e)=>{earlyAmount=parseFloat(e.target.value); earlyDirty=true; renderEarly();};
  document.getElementById('earlyFull').onclick=()=>{earlyDirty=false; renderEarly();};
  const sl=document.getElementById('slider');
  sl.min=0; sl.max=TIMELINE.length-1;
  sl.oninput=()=>{IDX=parseInt(sl.value);render();};
  document.getElementById('todayBtn').onclick=()=>setIdx(idxForDate(TODAY));
  document.getElementById('endBtn').onclick=()=>setIdx(TIMELINE.length-1);
  IDX=idxForDate(TODAY); sl.value=IDX;
  refreshTexts();
  window.addEventListener('resize',moveCursor);
}
init();
</script>
</body>
</html>
